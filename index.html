<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班团资源库 — 活动灵感 · PPT模板</title>
    <link rel="stylesheet" href="common.css">
    <style>
        /* ========== Hero ========== */
        .hero {
            padding: 5rem 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 4rem;
        }

        .hero-content { flex: 1; }

        .hero-badge {
            display: inline-block;
            padding: 0.3rem 0.85rem;
            background: var(--border);
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
        }

        .hero-title {
            font-family: var(--serif);
            font-size: 3.5rem;
            font-weight: 900;
            line-height: 1.15;
            letter-spacing: 0.03em;
            margin-bottom: 1.25rem;
        }

        .hero-highlight {
            background: linear-gradient(135deg, #1A56DB 0%, #7C3AED 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-desc {
            font-size: 1.1rem;
            color: var(--text-secondary);
            line-height: 1.8;
            margin-bottom: 2rem;
        }

        .hero-actions { display: flex; gap: 0.75rem; flex-wrap: wrap; }

        .hero-stats {
            display: flex;
            gap: 2.5rem;
            padding: 2rem 2.5rem;
            background: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
        }

        .stat-item { display: flex; flex-direction: column; align-items: center; }
        .stat-number { font-family: var(--serif); font-size: 2rem; font-weight: 700; color: var(--primary); }
        .stat-label { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem; }

        /* ========== Nav Cards ========== */
        .nav-cards {
            padding: 3rem 0 5rem;
            border-top: 1px solid var(--border);
        }

        .nav-cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 1.5rem;
        }

        .nav-card {
            display: flex;
            flex-direction: column;
            padding: 2.5rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            text-decoration: none;
            color: var(--text);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .nav-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: #D0D0D0;
        }

        .nav-card-icon {
            width: 56px;
            height: 56px;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.25rem;
            font-size: 1.5rem;
        }

        .icon-ppt { background: #EFF6FF; color: var(--primary); }
        .icon-activities { background: #ECFDF5; color: #059669; }

        .nav-card h3 {
            font-family: var(--serif);
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .nav-card p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.6;
            flex: 1;
        }

        .nav-card-arrow {
            margin-top: 1.25rem;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--primary);
        }

        /* ========== Responsive ========== */
        @media (max-width: 900px) {
            .hero { flex-direction: column; padding: 3rem 0; gap: 2rem; }
            .hero-title { font-size: 2.5rem; }
            .hero-stats { width: 100%; justify-content: center; gap: 2rem; }
        }

        @media (max-width: 600px) {
            .hero-title { font-size: 2rem; }
            .hero-desc { font-size: 0.95rem; }
            .hero-stats { padding: 1.5rem; gap: 1.5rem; }
            .stat-number { font-size: 1.5rem; }
            .nav-cards-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header class="site-header">
            <div class="header-left">
                <a href="index.html" class="header-logo">班团资源库</a>
                <nav class="header-nav">
                    <a href="index.html" class="nav-link active">首页</a>
                    <a href="ppt.html" class="nav-link">PPT模板</a>

                </nav>

        </header>

        <!-- Hero -->
        <section class="hero">
            <div class="hero-content">
                <span class="hero-badge">ZJU · ARCHIVE</span>
                <h1 class="hero-title">活动灵感<br><span class="hero-highlight">从这里出发</span></h1>
                <p class="hero-desc">汇集班团活动方案、精品PPT模板、实用工具，<br>让每一次展示都出彩</p>
                <div class="hero-actions">
                    <a href="ppt.html" class="btn-primary">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                        浏览PPT模板
                    </a>
                    <a href="activities.html" class="btn-secondary">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>

            </div>
            <div class="hero-stats">
                <div class="stat-item">
                    <span class="stat-number">30+</span>
                    <span class="stat-label">PPT模板</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number">33</span>

                <div class="stat-item">

                    <span class="stat-label">下载使用</span>

        </section>

        <!-- Quick Nav -->
        <section class="nav-cards">

            </div>
            <div class="nav-cards-grid">
                <a href="ppt.html" class="nav-card">
                    <div class="nav-card-icon icon-ppt">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                    </div>
                    <h3>PPT模板下载</h3>
                    <p>浙大官方模板、答辩汇报、商务通用、创意风格、校友总会等 30+ 精选模板，一键下载</p>
                    <span class="nav-card-arrow">浏览模板 →</span>
                </a>
                <a href="activities.html" class="nav-card">
                    <div class="nav-card-icon icon-activities">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    </div>
                    <h3>活动方案库</h3>
                    <p>33 个班团活动方案，涵盖破冰、思政、文娱、户外、零经费等多种类型，含详细步骤和物料清单</p>
                    <span class="nav-card-arrow">查看方案 →</span>
                </a>
            </div>
        </section>

        <!-- Footer -->
        <footer class="site-footer">
            <p>班团资源库 &copy; 2025 — 资源仅供学习交流使用</p>
        </footer>
    </div>

</body>
</html>
