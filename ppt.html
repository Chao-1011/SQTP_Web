<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPT模板下载 — 班团资源库</title>
    <link rel="stylesheet" href="common.css">
    <style>
        /* ========== PPT Page ========== */
        .ppt-page { padding: 3rem 0 5rem; }

        /* Search & Filter */
        .search-filter-bar { margin-bottom: 2.5rem; }

        .search-bar {
            position: relative;
            margin-bottom: 1.25rem;
        }

        .search-icon {
            position: absolute;
            top: 50%;
            left: 1rem;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        .search-bar input {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.75rem;
            font-size: 0.95rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: var(--sans);
        }
        .search-bar input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26,86,219,0.1);
        }
        .search-bar input::placeholder { color: var(--text-muted); }

        .result-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        .result-count { color: var(--text-muted); font-size: 0.9rem; }

        .filter-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .filter-tab {
            padding: 0.5rem 1.15rem;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface);
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: var(--sans);
            white-space: nowrap;
        }
        .filter-tab:hover { border-color: #C0C0C0; color: var(--text); }
        .filter-tab.active {
            background: var(--text);
            color: #fff;
            border-color: var(--text);
        }

        /* Template Grid */
        .template-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        /* Template Card */
        .template-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
        }
        .template-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: #D0D0D0;
        }

        .card-preview {
            position: relative;
            width: 100%;
            height: 200px;
            overflow: hidden;
            cursor: pointer;
            background: #F0EFEB;
        }

        .card-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s;
        }
        .template-card:hover .card-preview img { transform: scale(1.05); }

        .card-preview-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-align: center;
            padding: 1.5rem;
        }

        .placeholder-name {
            font-family: var(--serif);
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .placeholder-sub {
            font-size: 0.85rem;
            opacity: 0.8;
        }

        .card-preview-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .template-card:hover .card-preview-overlay { opacity: 1; }

        .preview-hint {
            color: #fff;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 0.5rem 1.25rem;
            border: 1.5px solid rgba(255,255,255,0.7);
            border-radius: 8px;
            background: rgba(0,0,0,0.2);
            backdrop-filter: blur(4px);
        }

        .card-body {
            padding: 1.25rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .card-category {
            display: inline-block;
            padding: 0.2rem 0.65rem;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            margin-bottom: 0.65rem;
            width: fit-content;
        }

        .cat-official { background: #EFF6FF; color: #1E40AF; }
        .cat-defense { background: #ECFDF5; color: #065F46; }
        .cat-business { background: #FFF7ED; color: #9A3412; }
        .cat-creative { background: #F5F3FF; color: #5B21B6; }
        .cat-alumni { background: #FEF2F2; color: #991B1B; }
        .cat-classic { background: #F0F9FF; color: #0369A1; }
        .cat-other { background: #FFFBE6; color: #A16207; }
        .cat-pack { background: #F1F5F9; color: #334155; }

        .card-name {
            font-family: var(--serif);
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
            color: var(--text);
        }

        .card-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.55;
            margin-bottom: 1rem;
            flex: 1;
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
            margin-bottom: 1rem;
        }

        .card-tag {
            padding: 0.18rem 0.55rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        .card-actions { display: flex; gap: 0.5rem; }

        .btn-download, .btn-preview {
            flex: 1;
            padding: 0.55rem 0;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            text-decoration: none;
            font-family: var(--sans);
        }

        .btn-download {
            background: var(--primary);
            color: #fff;
            border: none;
        }
        .btn-download:hover { background: var(--primary-hover); }

        .btn-preview {
            background: var(--surface);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .btn-preview:hover { background: #F5F5F2; border-color: #C0C0C0; }

        /* ========== Modal ========== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-content {
            background: var(--surface);
            border-radius: var(--radius-lg);
            max-width: 900px;
            width: 90vw;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            box-shadow: var(--shadow-lg);
        }

        .modal-close {
            position: absolute;
            top: 0.75rem;
            right: 1rem;
            background: rgba(0,0,0,0.05);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: background 0.2s;
        }
        .modal-close:hover { background: rgba(0,0,0,0.1); }

        .modal-body { padding: 2rem; }

        .modal-body img {
            width: 100%;
            border-radius: var(--radius);
            margin-bottom: 1.25rem;
            border: 1px solid var(--border);
        }

        .modal-body .modal-title {
            font-family: var(--serif);
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.35rem;
        }

        .modal-body .modal-category {
            display: inline-block;
            padding: 0.2rem 0.65rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        .modal-body .modal-desc {
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 1.25rem;
        }

        .modal-body .modal-scenarios {
            margin-bottom: 1.5rem;
        }

        .modal-body .modal-scenarios h4 {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        .modal-body .modal-scenarios ul {
            list-style: none;
            padding: 0;
        }

        .modal-body .modal-scenarios li {
            padding: 0.35rem 0;
            font-size: 0.88rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .modal-body .modal-scenarios li::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--primary);
            flex-shrink: 0;
        }

        .btn-download-large {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 2rem;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            font-family: var(--sans);
        }
        .btn-download-large:hover { background: var(--primary-hover); }

        /* ========== No Results ========== */
        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }
        .no-results svg { margin-bottom: 1rem; opacity: 0.4; }
        .no-results h3 { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-secondary); }

        /* Disclaimer */
        .disclaimer {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.85rem 1.25rem;
            background: #FFFBE6;
            border: 1px solid #FDE68A;
            border-radius: var(--radius);
            margin-bottom: 2rem;
            font-size: 0.88rem;
            color: #92400E;
        }
        .disclaimer svg { flex-shrink: 0; }

        /* ========== Load More ========== */
        .btn-load-more {
            display: block;
            width: 100%;
            max-width: 360px;
            margin: 2.5rem auto 0;
            padding: 0.9rem 2rem;
            background: var(--surface);
            border: 1.5px dashed var(--border);
            border-radius: 12px;
            color: var(--text-secondary);
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s;
            font-family: var(--sans);
        }
        .btn-load-more:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(0, 79, 159, 0.03);
        }

        /* ========== Responsive ========== */
        @media (max-width: 900px) {
            .template-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
        }
        @media (max-width: 600px) {
            .template-grid { grid-template-columns: 1fr; }
            .filter-tabs { overflow-x: auto; flex-wrap: nowrap; padding-bottom: 0.5rem; }
            .filter-tab { flex-shrink: 0; }
            .modal-content { width: 95vw; }
            .gallery-arrow { width: 32px; height: 32px; font-size: 0.9rem; }
            .gallery-thumb { width: 56px; height: 42px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header class="site-header">
            <div class="header-left">
                <a href="index.html" class="header-logo">班团资源库</a>
                <nav class="header-nav">
                    <a href="index.html" class="nav-link">首页</a>
                    <a href="resources.html" class="nav-link active">活动资源</a>
                    <a href="activities.html" class="nav-link">活动方案</a>
                </nav>
            </div>
        </header>

        <!-- Main -->
        <main class="ppt-page">
            <div class="section-header">
                <span class="section-tag">TEMPLATES</span>
                <h1 class="section-title">PPT模板下载</h1>
                <p class="section-desc">精选 40+ 优质模板，覆盖答辩、商务、创意、校友等多种场景，一键下载使用</p>
            </div>

            <div class="disclaimer">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <span>以下PPT模板均从不同途径收集而来，仅供学习参考使用</span>
            </div>

            <div class="search-filter-bar">
                <div class="search-bar">
                    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="pptSearch" placeholder="搜索模板名称、场景、标签...">
                </div>
                <div class="result-info">
                    <span class="result-count" id="resultCount">(共 43 个模板)</span>
                </div>
                <div class="filter-tabs" id="filterTabs">
                    <button class="filter-tab active" data-filter="all">全部模板</button>
                    <button class="filter-tab" data-filter="official">浙大官方</button>
                    <button class="filter-tab" data-filter="classic">浙大经典</button>
                    <button class="filter-tab" data-filter="defense">答辩汇报</button>
                    <button class="filter-tab" data-filter="business">商务通用</button>
                    <button class="filter-tab" data-filter="creative">创意风格</button>
                    <button class="filter-tab" data-filter="alumni">校友总会</button>
                    <button class="filter-tab" data-filter="other">英文展示</button>
                    <button class="filter-tab" data-filter="pack">压缩包</button>
                </div>
            </div>

            <div class="template-grid" id="templateGrid"></div>
        </main>

        <footer class="site-footer">
            <p>班团资源库 &copy; 2025 — 资源仅供学习交流使用</p>
        </footer>
    </div>

    <!-- Preview Modal -->
    <div class="modal-overlay" id="previewModal">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">&times;</button>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script src="ppt.js"></script>
</body>
</html>
