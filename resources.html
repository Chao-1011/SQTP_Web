<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活动资源 — 班团资源库</title>
    <link rel="stylesheet" href="common.css">
    <style>
        .resources-page { padding: 3rem 0 5rem; }

        /* ===== Tab Navigation ===== */
        .tab-nav {
            display: flex;
            gap: 0;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--border);
        }
        .tab-btn {
            padding: 0.85rem 2rem;
            border: none;
            background: none;
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            font-family: var(--sans);
            position: relative;
            bottom: -2px;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .tab-btn:hover { color: var(--text); }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

        /* ===== PPT Section (IDs match ppt.js expectations) ===== */
        .search-bar { position: relative; margin-bottom: 1.25rem; }
        .search-icon { position: absolute; top: 50%; left: 1rem; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
        .search-bar input {
            width: 100%; padding: 0.85rem 1rem 0.85rem 2.75rem; font-size: 0.95rem;
            border: 1px solid var(--border); border-radius: var(--radius);
            background: var(--surface); outline: none; transition: border-color 0.2s, box-shadow 0.2s;
            font-family: var(--sans);
        }
        .search-bar input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(26,86,219,0.1); }
        .search-bar input::placeholder { color: var(--text-muted); }

        .result-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .result-count { color: var(--text-muted); font-size: 0.9rem; }

        .filter-tabs { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .filter-tab {
            padding: 0.5rem 1.15rem; border: 1px solid var(--border); border-radius: 999px;
            background: var(--surface); color: var(--text-secondary); font-size: 0.85rem;
            font-weight: 500; cursor: pointer; transition: all 0.2s;
            font-family: var(--sans); white-space: nowrap;
        }
        .filter-tab:hover { border-color: #C0C0C0; color: var(--text); }
        .filter-tab.active { background: var(--text); color: #fff; border-color: var(--text); }

        /* ===== Grid & Cards ===== */
        .template-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }
        .template-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-lg); overflow: hidden;
            transition: all 0.3s; display: flex; flex-direction: column;
        }
        .template-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: #D0D0D0; }
        .card-preview { position: relative; width: 100%; height: 200px; overflow: hidden; cursor: pointer; background: #F0EFEB; }
        .card-preview img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s; }
        .template-card:hover .card-preview img { transform: scale(1.05); }

        .card-preview-placeholder {
            width: 100%; height: 100%; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: #fff; text-align: center; padding: 1.5rem;
        }
        .placeholder-name { font-family: var(--serif); font-size: 1.3rem; font-weight: 700; margin-bottom: 0.25rem; }
        .placeholder-sub { font-size: 0.85rem; opacity: 0.8; }

        .card-preview-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.3);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.3s;
        }
        .template-card:hover .card-preview-overlay { opacity: 1; }
        .preview-hint {
            color: #fff; font-size: 0.9rem; font-weight: 500;
            padding: 0.5rem 1.25rem; border: 1.5px solid rgba(255,255,255,0.7);
            border-radius: 8px; background: rgba(0,0,0,0.2); backdrop-filter: blur(4px);
        }

        .card-body { padding: 1.25rem; flex: 1; display: flex; flex-direction: column; }
        .card-category { display: inline-block; padding: 0.2rem 0.65rem; border-radius: 999px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.05em; margin-bottom: 0.65rem; width: fit-content; }
        .cat-official { background: #EFF6FF; color: #1E40AF; }
        .cat-defense { background: #ECFDF5; color: #065F46; }
        .cat-business { background: #FFF7ED; color: #9A3412; }
        .cat-creative { background: #F5F3FF; color: #5B21B6; }
        .cat-alumni { background: #FEF2F2; color: #991B1B; }
        .cat-classic { background: #F0F9FF; color: #0369A1; }
        .cat-other { background: #FFFBE6; color: #A16207; }
        .cat-pack { background: #F1F5F9; color: #334155; }
        .cat-template { background: #EFF6FF; color: #1E40AF; }
        .cat-case { background: #ECFDF5; color: #065F46; }
        .cat-special { background: #F5F3FF; color: #5B21B6; }

        .card-name { font-family: var(--serif); font-size: 1.15rem; font-weight: 700; margin-bottom: 0.4rem; color: var(--text); }
        .card-desc { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.55; margin-bottom: 1rem; flex: 1; }
        .card-tags { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 1rem; }
        .card-tag { padding: 0.18rem 0.55rem; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; font-size: 0.72rem; color: var(--text-muted); }
        .card-actions { display: flex; gap: 0.5rem; }
        .btn-download, .btn-preview {
            flex: 1; padding: 0.55rem 0; border-radius: 8px; font-size: 0.85rem;
            font-weight: 600; cursor: pointer; transition: all 0.2s;
            text-align: center; text-decoration: none; font-family: var(--sans);
        }
        .btn-download { background: var(--primary); color: #fff; border: none; }
        .btn-download:hover { background: var(--primary-hover); }
        .btn-preview { background: var(--surface); color: var(--text-secondary); border: 1px solid var(--border); }
        .btn-preview:hover { background: #F5F5F2; border-color: #C0C0C0; }

        /* ===== Modal ===== */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            backdrop-filter: blur(6px); display: flex; align-items: center;
            justify-content: center; z-index: 1000; opacity: 0;
            pointer-events: none; transition: opacity 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content { background: var(--surface); border-radius: var(--radius-lg); max-width: 900px; width: 90vw; max-height: 85vh; overflow-y: auto; position: relative; box-shadow: var(--shadow-lg); }
        .modal-close { position: absolute; top: 0.75rem; right: 1rem; background: rgba(0,0,0,0.05); border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 1.5rem; cursor: pointer; color: var(--text-secondary); display: flex; align-items: center; justify-content: center; z-index: 10; transition: background 0.2s; }
        .modal-close:hover { background: rgba(0,0,0,0.1); }
        .modal-body { padding: 2rem; }
        .modal-body img { width: 100%; border-radius: var(--radius); margin-bottom: 1.25rem; border: 1px solid var(--border); }
        .modal-body .modal-title { font-family: var(--serif); font-size: 1.5rem; font-weight: 700; margin-bottom: 0.35rem; }
        .modal-body .modal-category { display: inline-block; padding: 0.2rem 0.65rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; margin-bottom: 0.75rem; }
        .modal-body .modal-desc { color: var(--text-secondary); line-height: 1.7; margin-bottom: 1.25rem; }
        .modal-body .modal-scenarios { margin-bottom: 1.5rem; }
        .modal-body .modal-scenarios h4 { font-size: 0.9rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text); }
        .modal-body .modal-scenarios ul { list-style: none; padding: 0; }
        .modal-body .modal-scenarios li { padding: 0.35rem 0; font-size: 0.88rem; color: var(--text-secondary); display: flex; align-items: center; gap: 0.5rem; }
        .modal-body .modal-scenarios li::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--primary); flex-shrink: 0; }
        .btn-download-large {
            display: inline-flex; align-items: center; gap: 0.5rem;
            padding: 0.75rem 2rem; background: var(--primary); color: #fff;
            border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 600;
            cursor: pointer; text-decoration: none; transition: all 0.2s; font-family: var(--sans);
        }
        .btn-download-large:hover { background: var(--primary-hover); }

        /* ===== Proposal gradients ===== */
        .ph-g-0 { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .ph-g-1 { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .ph-g-2 { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .ph-g-3 { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
        .ph-g-4 { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
        .ph-g-5 { background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%); }
        .ph-g-6 { background: linear-gradient(135deg, #fccb90 0%, #d57eeb 100%); }
        .ph-g-7 { background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%); }
        .ph-g-8 { background: linear-gradient(135deg, #f5576c 0%, #ff6f00 100%); }
        .ph-g-9 { background: linear-gradient(135deg, #667eea 0%, #00f2fe 100%); }
        .ph-g-10 { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
        .ph-g-11 { background: linear-gradient(135deg, #fc4a1a 0%, #f7b733 100%); }
        .ph-g-12 { background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%); }
        .ph-g-13 { background: linear-gradient(135deg, #ee5a24 0%, #f1c40f 100%); }
        .ph-g-14 { background: linear-gradient(135deg, #834d9b 0%, #d04ed6 100%); }
        .ph-g-15 { background: linear-gradient(135deg, #00b09b 0%, #96c93d 100%); }

        /* ===== Activity list styles ===== */
        .activity-list-section { display: flex; flex-direction: column; }
        .activity-item {
            display: flex; justify-content: space-between; align-items: flex-start;
            padding: 2rem 1rem; border-bottom: 1px solid var(--border);
            transition: background-color 0.2s; cursor: pointer; margin: 0 -1rem; border-radius: 8px;
        }
        .activity-item:hover { background-color: rgba(248, 247, 243, 0.9); }
        .activity-item .item-details { flex: 1; padding-right: 2rem; }
        .activity-item .item-details h4 { font-family: var(--serif); font-size: 1.3rem; font-weight: 700; margin-bottom: 0.75rem; }
        .activity-item .item-details p { color: #555; margin-bottom: 1rem; font-size: 0.95rem; line-height: 1.7; }
        .act-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.75rem; }
        .act-tag { padding: 0.2rem 0.7rem; border-radius: 999px; font-size: 0.8rem; font-weight: 500; }
        .act-tag[data-t="破冰"] { background: #FCEAE8; color: #C07065; }
        .act-tag[data-t="文娱"] { background: #FDF3E7; color: #B58A59; }
        .act-tag[data-t="思政"] { background: #F9EBEB; color: #A66464; }
        .act-tag[data-t="工具"] { background: #EBF4FA; color: #6993B0; }
        .act-tag[data-t="案例"] { background: #EDF6F0; color: #689E78; }
        .act-tag[data-t="零经费"] { background: #F0F4F8; color: #7B8D9E; }
        .act-tag[data-t="户外"] { background: #F2F0E6; color: #9A8D60; }
        .act-meta { display: flex; flex-wrap: wrap; gap: 1.5rem; color: #999; font-size: 0.9rem; }
        .act-meta span { display: flex; align-items: center; gap: 0.35rem; }
        .act-rating { font-size: 1.1rem; color: #E0E0E0; white-space: nowrap; margin-top: 3px; }
        .act-rating .filled { color: #D4C4A8; }

        .no-results { grid-column: 1 / -1; text-align: center; padding: 4rem 2rem; color: var(--text-muted); }
        .no-results svg { margin-bottom: 1rem; opacity: 0.4; }
        .no-results h3 { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-secondary); }

        .disclaimer {
            display: flex; align-items: center; gap: 0.6rem;
            padding: 0.85rem 1.25rem; background: #FFFBE6;
            border: 1px solid #FDE68A; border-radius: var(--radius);
            margin-bottom: 2rem; font-size: 0.88rem; color: #92400E;
        }
        .disclaimer svg { flex-shrink: 0; }

        /* ========== Load More ========== */
        .btn-load-more {
            display: block;
            width: 100%;
            max-width: 360px;
            margin: 2.5rem auto 0;
            padding: 0.9rem 2rem;
            background: var(--surface);
            border: 1.5px dashed var(--border);
            border-radius: 12px;
            color: var(--text-secondary);
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s;
            font-family: var(--sans);
        }
        .btn-load-more:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(0, 79, 159, 0.03);
        }

        /* ========== Card Slide Count Badge ========== */
        .card-slide-count {
            position: absolute;
            top: 0.6rem;
            right: 0.6rem;
            background: rgba(0,0,0,0.6);
            color: #fff;
            font-size: 0.7rem;
            padding: 0.25rem 0.55rem;
            border-radius: 6px;
            backdrop-filter: blur(4px);
            pointer-events: none;
            z-index: 2;
        }

        /* ========== Gallery ========== */
        .gallery-main {
            position: relative;
            margin-bottom: 0.75rem;
            border-radius: 12px;
            overflow: hidden;
            background: #1a1a1a;
        }
        .gallery-main img {
            width: 100%;
            display: block;
            border-radius: 12px;
            margin-bottom: 0;
            border: none;
        }
        .gallery-single img {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 1.25rem;
            border: 1px solid var(--border);
        }

        .gallery-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.45);
            color: #fff;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        .gallery-arrow:hover { background: rgba(0,0,0,0.7); }
        .gallery-prev { left: 0.75rem; }
        .gallery-next { right: 0.75rem; }

        .gallery-counter {
            position: absolute;
            bottom: 0.75rem;
            right: 0.75rem;
            background: rgba(0,0,0,0.55);
            color: #fff;
            font-size: 0.78rem;
            padding: 0.25rem 0.65rem;
            border-radius: 6px;
            backdrop-filter: blur(4px);
        }

        .gallery-thumbs {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
            scrollbar-width: thin;
        }
        .gallery-thumb {
            width: 72px;
            height: 54px;
            object-fit: cover;
            border-radius: 6px;
            border: 2px solid transparent;
            cursor: pointer;
            flex-shrink: 0;
            transition: border-color 0.2s, opacity 0.2s;
            opacity: 0.55;
        }
        .gallery-thumb:hover { opacity: 0.85; }
        .gallery-thumb.active {
            border-color: var(--primary);
            opacity: 1;
        }

        @media (max-width: 600px) {
            .template-grid { grid-template-columns: 1fr; }
            .filter-tabs { overflow-x: auto; flex-wrap: nowrap; padding-bottom: 0.5rem; }
            .filter-tab { flex-shrink: 0; }
            .tab-btn { padding: 0.75rem 1rem; font-size: 0.9rem; }
            .modal-content { width: 95vw; }
            .activity-item { flex-direction: column; }
            .gallery-arrow { width: 32px; height: 32px; font-size: 0.9rem; }
            .gallery-thumb { width: 56px; height: 42px; }
        }
    </style>
</head>
<body>

<!-- Hidden stubs for ppt.js compatibility (it expects #templateGrid, #filterTabs, #resultCount) -->
<div style="display:none" aria-hidden="true">
    <div id="templateGrid"></div>
    <div id="filterTabs"></div>
    <span id="resultCount"></span>
</div>

<div class="container">
    <header class="site-header">
        <div class="header-left">
            <a href="index.html" class="header-logo">班团资源库</a>
            <nav class="header-nav">
                <a href="index.html" class="nav-link">首页</a>
                <a href="guide.html" class="nav-link">策划指南</a>
                <a href="resources.html" class="nav-link active">活动资源</a>
                <a href="activities.html" class="nav-link">活动方案</a>
            </nav>
        </div>
    </header>

    <main class="resources-page">
        <div class="section-header">
            <span class="section-tag">RESOURCES</span>
            <h1 class="section-title">活动资源</h1>
            <p class="section-desc">PPT模板 · 策划案模板 · 活动方案，一站式获取</p>
        </div>

        <!-- Tab Navigation -->
        <div class="tab-nav" id="tabNav">
            <button class="tab-btn active" data-tab="ppt">PPT模板</button>
            <button class="tab-btn" data-tab="proposal">策划案模板</button>
        </div>

        <div class="disclaimer">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span>以下资源均从不同途径收集而来，仅供学习参考使用</span>
        </div>

        <!-- ==================== TAB 1: PPT ==================== -->
        <div id="tab-ppt" class="tab-content">
            <div class="search-bar">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="pptSearch" placeholder="搜索PPT模板名称、场景、标签...">
            </div>
            <div class="result-info">
                <span class="result-count" id="pptResultCount">(共 43 个模板)</span>
            </div>
            <div class="filter-tabs" id="pptFilterTabs">
                <button class="filter-tab active" data-filter="all">全部模板</button>
                <button class="filter-tab" data-filter="official">浙大官方</button>
                <button class="filter-tab" data-filter="classic">浙大经典</button>
                <button class="filter-tab" data-filter="defense">答辩汇报</button>
                <button class="filter-tab" data-filter="business">商务通用</button>
                <button class="filter-tab" data-filter="creative">创意风格</button>
                <button class="filter-tab" data-filter="alumni">校友总会</button>
                <button class="filter-tab" data-filter="other">英文展示</button>
                <button class="filter-tab" data-filter="pack">压缩包</button>
            </div>
            <div class="template-grid" id="pptGrid"></div>
        </div>

        <!-- ==================== TAB 2: 策划案 ==================== -->
        <div id="tab-proposal" class="tab-content" style="display:none;">
            <div class="search-bar">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="proposalSearch" placeholder="搜索策划案模板名称、标签...">
            </div>
            <div class="result-info">
                <span class="result-count" id="proposalResultCount">(共 16 个模板)</span>
            </div>
            <div class="filter-tabs" id="proposalFilterTabs">
                <button class="filter-tab active" data-filter="all">全部模板</button>
                <button class="filter-tab" data-filter="template">通用模板</button>
                <button class="filter-tab" data-filter="case">班会案例</button>
                <button class="filter-tab" data-filter="special">专项活动</button>
            </div>
            <div class="template-grid" id="proposalGrid"></div>
        </div>

    </main>

    <footer class="site-footer">
        <p>班团资源库 &copy; 2025 — 资源仅供学习交流使用</p>
    </footer>
</div>

<!-- Preview Modal -->
<div class="modal-overlay" id="previewModal">
    <div class="modal-content">
        <button class="modal-close" id="modalClose">&times;</button>
        <div class="modal-body" id="modalBody"></div>
    </div>
</div>

<script src="ppt.js"></script>
<script src="proposals.js"></script>
<script>
// ========== Tab Switching ==========
(function() {
    var tabBtns = document.querySelectorAll('#tabNav .tab-btn');
    var tabs = {
        ppt: document.getElementById('tab-ppt'),
        proposal: document.getElementById('tab-proposal')
    };

    function switchTab(name) {
        tabBtns.forEach(function(b) { b.classList.remove('active'); });
        var btn = document.querySelector('#tabNav .tab-btn[data-tab="' + name + '"]');
        if (btn) btn.classList.add('active');
        Object.keys(tabs).forEach(function(k) {
            tabs[k].style.display = k === name ? 'block' : 'none';
        });
    }

    tabBtns.forEach(function(btn) {
        btn.addEventListener('click', function() { switchTab(btn.dataset.tab); });
    });

    var saved = sessionStorage.getItem('activeTab');
    if (saved && tabs[saved]) { switchTab(saved); sessionStorage.removeItem('activeTab'); }

    // ===== Override ppt.js auto-render (it uses #templateGrid which doesn't exist here) =====
    // ppt.js errors silently since #templateGrid is null. We handle PPT rendering ourselves.

    // ===== PPT Rendering =====
    var pptGrid = document.getElementById('pptGrid');
    var pptSearch = document.getElementById('pptSearch');
    var pptResultCount = document.getElementById('pptResultCount');
    var pptFilterTabs = document.getElementById('pptFilterTabs');

    var pColors = [
        'linear-gradient(135deg, #1a1a2e, #16213e)', 'linear-gradient(135deg, #0f3460, #533483)',
        'linear-gradient(135deg, #2d3436, #636e72)', 'linear-gradient(135deg, #6c5ce7, #a29bfe)',
        'linear-gradient(135deg, #00b894, #55efc4)', 'linear-gradient(135deg, #e17055, #fdcb6e)',
        'linear-gradient(135deg, #0984e3, #74b9ff)', 'linear-gradient(135deg, #d63031, #ff7675)'
    ];

    function renderPPTCards(data) {
        if (!pptGrid) return;
        pptGrid.innerHTML = '';
        if (!data.length) {
            pptGrid.innerHTML = '<div class="no-results"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><h3>没有找到匹配的模板</h3><p>试试调整搜索关键词或筛选条件</p></div>';
            return;
        }
        data.forEach(function(item, idx) {
            var card = document.createElement('div');
            card.className = 'template-card';

            var previewHTML;
            if (item.preview) {
                previewHTML = '<img src="' + item.preview + '" alt="' + item.name + '" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">' +
                    '<div class="card-preview-overlay"><span class="preview-hint">点击预览</span></div>';
            } else {
                var c = item.gradient || pColors[idx % pColors.length];
                previewHTML = '<div class="card-preview-placeholder" style="background:' + c + ';">' +
                    '<span class="placeholder-name">' + item.name + '</span>' +
                    '<span class="placeholder-sub">' + (item.catLabel || '') + '</span></div>';
            }

            card.innerHTML =
                '<div class="card-preview" data-action="preview" data-id="' + item.id + '">' + previewHTML + '</div>' +
                '<div class="card-body">' +
                '<span class="card-category ' + (item.catClass || 'cat-other') + '">' + (item.catLabel || '') + '</span>' +
                '<h3 class="card-name">' + item.name + '</h3>' +
                '<p class="card-desc">' + item.desc + '</p>' +
                '<div class="card-tags">' + (item.tags || []).map(function(t) { return '<span class="card-tag">' + t + '</span>'; }).join('') + '</div>' +
                '<div class="card-actions">' +
                '<a href="' + item.download + '" class="btn-download" download>下载</a>' +
                '<button class="btn-preview" data-action="preview" data-id="' + item.id + '">预览</button>' +
                '</div></div>';

            pptGrid.appendChild(card);
        });
    }

    function filterPPT() {
        var term = (pptSearch.value || '').toLowerCase().trim();
        var f = (pptFilterTabs.querySelector('.filter-tab.active') || {}).dataset || {filter:'all'};
        var filter = f.filter || 'all';

        var filtered = (typeof templateData !== 'undefined' ? templateData : []).filter(function(item) {
            if (filter !== 'all' && item.category !== filter) return false;
            if (term) {
                var hay = (item.name + ' ' + item.desc + ' ' + (item.tags||[]).join(' ') + ' ' + (item.scenarios||[]).join(' ')).toLowerCase();
                return hay.indexOf(term) !== -1;
            }
            return true;
        });
        pptResultCount.textContent = '(共 ' + filtered.length + ' 个模板)';
        renderPPTCards(filtered);
    }

    if (pptSearch) pptSearch.addEventListener('input', filterPPT);
    pptFilterTabs.querySelectorAll('.filter-tab').forEach(function(b) {
        b.addEventListener('click', function() {
            pptFilterTabs.querySelectorAll('.filter-tab').forEach(function(x) { x.classList.remove('active'); });
            b.classList.add('active');
            filterPPT();
        });
    });

    if (typeof templateData !== 'undefined') {
        renderPPTCards(templateData);
        pptResultCount.textContent = '(共 ' + templateData.length + ' 个模板)';
    }

    // ===== Proposal Rendering =====
    var proposalGrid = document.getElementById('proposalGrid');
    var proposalSearch = document.getElementById('proposalSearch');
    var proposalResultCount = document.getElementById('proposalResultCount');
    var proposalFilterTabs = document.getElementById('proposalFilterTabs');

    function renderProposalCards(data) {
        if (!proposalGrid) return;
        proposalGrid.innerHTML = '';
        if (!data.length) {
            proposalGrid.innerHTML = '<div class="no-results"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><h3>没有找到匹配的模板</h3><p>试试调整搜索关键词或筛选条件</p></div>';
            return;
        }
        data.forEach(function(item, idx) {
            var card = document.createElement('div');
            card.className = 'template-card';
            card.innerHTML =
                '<div class="card-preview ph-g-' + (idx % 16) + '" style="cursor:pointer" onclick="showProposalPreview(\'' + item.id + '\')">' +
                '<span style="font-size:3rem;opacity:0.9;">📋</span>' +
                '<div class="card-preview-overlay"><span class="preview-hint">点击预览全文</span></div></div>' +
                '<div class="card-body">' +
                '<span class="card-category ' + (item.catClass || 'cat-other') + '">' + (item.catLabel || '') + '</span>' +
                '<h3 class="card-name">' + item.name + '</h3>' +
                '<p class="card-desc">' + item.desc + '</p>' +
                '<div class="card-tags">' + (item.tags || []).map(function(t) { return '<span class="card-tag">' + t + '</span>'; }).join('') + '</div>' +
                '<div class="card-actions">' +
                '<a href="' + item.download + '" class="btn-download" download style="flex:2;">下载 Word 文档</a>' +
                '</div></div>';
            proposalGrid.appendChild(card);
        });
    }

    function filterProposal() {
        var term = (proposalSearch.value || '').toLowerCase().trim();
        var f = (proposalFilterTabs.querySelector('.filter-tab.active') || {}).dataset || {filter:'all'};
        var filter = f.filter || 'all';

        var filtered = (typeof proposalData !== 'undefined' ? proposalData : []).filter(function(item) {
            if (filter !== 'all' && item.category !== filter) return false;
            if (term) {
                var hay = (item.name + ' ' + item.desc + ' ' + (item.tags||[]).join(' ')).toLowerCase();
                return hay.indexOf(term) !== -1;
            }
            return true;
        });
        proposalResultCount.textContent = '(共 ' + filtered.length + ' 个模板)';
        renderProposalCards(filtered);
    }

    if (proposalSearch) proposalSearch.addEventListener('input', filterProposal);
    proposalFilterTabs.querySelectorAll('.filter-tab').forEach(function(b) {
        b.addEventListener('click', function() {
            proposalFilterTabs.querySelectorAll('.filter-tab').forEach(function(x) { x.classList.remove('active'); });
            b.classList.add('active');
            filterProposal();
        });
    });

    if (typeof proposalData !== 'undefined') {
        renderProposalCards(proposalData);
        proposalResultCount.textContent = '(共 ' + proposalData.length + ' 个模板)';
    }

    // ===== Proposal Preview Modal =====
    window.showProposalPreview = function(id) {
        var item = (typeof proposalData !== 'undefined' ? proposalData : []).find(function(t) { return t.id === id; });
        if (!item) return;

        var previewText = item.preview || '';
        // Convert \n to <br> for display
        var previewHTML = previewText
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/\\n/g, '<br>')
            .replace(/【(.+?)】/g, '<strong style="font-size:1.05rem;color:#2C2C2C;">$1</strong>');

        modalBody.innerHTML =
            '<span class="modal-category ' + (item.catClass || 'cat-other') + '">' + (item.catLabel || '') + '</span>' +
            '<h2 class="modal-title">' + item.name + '</h2>' +
            '<p class="modal-desc">' + item.desc + '</p>' +
            '<div style="background:#FAFAF8;border:1px solid #E8E6E1;border-radius:12px;padding:1.5rem;max-height:50vh;overflow-y:auto;line-height:2;font-size:0.9rem;white-space:pre-wrap;">' + previewHTML + '</div>' +
            '<div style="margin-top:1.5rem;">' +
            '<a href="' + item.download + '" class="btn-download-large" download>' +
            '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> 下载完整文档</a>' +
            '</div>';
        modal.classList.add('active');
    };

    // ===== PPT Preview Modal (event delegation) =====
    var modal = document.getElementById('previewModal');
    var modalBody = document.getElementById('modalBody');
    var modalClose = document.getElementById('modalClose');

    document.getElementById('pptGrid').addEventListener('click', function(e) {
        var btn = e.target.closest('[data-action="preview"]');
        if (!btn) return;
        var id = btn.dataset.id;
        var item = (typeof templateData !== 'undefined' ? templateData : []).find(function(t) { return t.id === id; });
        if (!item) return;

        var imgHTML = item.preview
            ? '<img src="' + item.preview + '" alt="' + item.name + '" onerror="this.style.display=\'none\'">'
            : '';
        modalBody.innerHTML =
            imgHTML +
            '<span class="modal-category ' + (item.catClass || 'cat-other') + '">' + (item.catLabel || '') + '</span>' +
            '<h2 class="modal-title">' + item.name + '</h2>' +
            '<p class="modal-desc">' + item.desc + '</p>' +
            (item.scenarios ? '<div class="modal-scenarios"><h4>适用场景</h4><ul>' + item.scenarios.map(function(s) { return '<li>' + s + '</li>'; }).join('') + '</ul></div>' : '') +
            '<a href="' + item.download + '" class="btn-download-large" download>' +
            '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> 下载文件</a>';
        modal.classList.add('active');
    });

    modalClose.addEventListener('click', function() { modal.classList.remove('active'); });
    modal.addEventListener('click', function(e) { if (e.target === modal) modal.classList.remove('active'); });
    document.addEventListener('keydown', function(e) { if (e.key === 'Escape') modal.classList.remove('active'); });

})();
</script>

</body>
</html>
